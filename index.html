<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T Css 3d</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main">
      <div class="screen"></div>
      <script type="module" src="./src/main3d.js"></script>
      <div>WASD,QE - move</div>
      <div>Arrows - look</div>
      <div class="row controls">
        <div class="col">
          <div class="row">
            <button class="btn-q">up</button>
            <button class="btn-w">fwd</button>
            <button class="btn-e">dwn</button>
          </div>
          <div class="row">
            <button class="btn-a">lft</button>
            <button class="btn-s">bck</button>
            <button class="btn-d">rht</button>
          </div>
        </div>
        <div class="col">
          <button class="btn-arrowup">up</button>
          <div class="row">
            <button class="btn-arrowleft">lft</button>
            <button class="btn-arrowdown">dwn</button>
            <button class="btn-arrowright">rht</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
